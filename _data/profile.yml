short_bio: >-
  <p>
    Hi, my name is Yibin Che, welcome to my homepage.
  </p>
  <p>
    Currently, I am a Resident Physician🧑‍⚕️ in the Department of Liver Surgery at Renji Hospital, Shanghai Jiao Tong University School of Medicine, and I am proud to be a member of <a href="https://www.shsmu.edu.cn/english/info/1354/4092.htm"_blank">Prof. Qiang Xia</a> ’s team, renowned for pediatric liver transplantation in the world. 
    My research interests mainly focus on hepatobiliary malignancies and liver transplantation. Welcome to reach out to me for communication and cooperation!
  </p>

